version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahatak_user
      POSTGRES_PASSWORD: sahatak_pass
      POSTGRES_DB: sahatak_db
    ports:
      - "5432:5432"
    volumes:
      - sahatak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahatak_user -d sahatak_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://sahatak_user:sahatak_pass@db:5432/sahatak_db
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sahatak_pgdata:
