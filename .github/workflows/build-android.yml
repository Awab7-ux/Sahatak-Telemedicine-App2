name: Build Android APK

# Manual builds from the Actions tab, plus automatic builds on every push to main.
# If you only want manual (workflow_dispatch) builds, delete the "push:" block.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Assemble debug APK (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        # React Native app root (contains package.json, android/, .env)
        working-directory: sahatak-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 20 with npm cache. cache-dependency-path is required because
      # package-lock.json lives inside sahatak-mobile/, not at the repo root.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sahatak-mobile/package-lock.json

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache Gradle so repeat builds finish much faster. Note: ubuntu-latest
      # ships with the Android SDK preinstalled, so no SDK setup step is needed.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sahatak-mobile/android/gradle/wrapper/gradle-wrapper.properties', 'sahatak-mobile/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      # Regenerate .env on the runner from GitHub Secrets. The real .env is
      # gitignored and never leaves your machine; this replaces it with the
      # production values so the bundler inlines them into the JS bundle.
      - name: Generate .env from GitHub Secrets
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          {
            echo "# Generated by GitHub Actions (build-android.yml) - do not commit"
            echo "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL}"
          } > .env
          echo "Wrote sahatak-mobile/.env"

      # Fail fast with a clear error if a required secret was not configured.
      - name: Validate .env values
        run: |
          missing=0
          while IFS='=' read -r key value; do
            case "$key" in ''|\#*) continue ;; esac
            if [ -z "$value" ]; then
              echo "::error::GitHub secret '$key' is missing or empty. Add it under Settings > Secrets and variables > Actions > New repository secret."
              missing=1
            fi
          done < .env
          exit $missing

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahatak-release-apk
          path: sahatak-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
